[package]
name = "flowcash"
version = "1.0.0"
description = "FlowCash - Privacy-focused offline-first personal cash-flow engine"
authors = ["FlowCash Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
